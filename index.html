<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDP Line Slot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@500;700&display=swap">
<style>
:root{
  --ground:#F2F5F3; --surface:#FFFFFF; --surface2:#E9EEEB; --line:#CDD6D2;
  --ink:#16211E; --muted:#66756F; --accent:#0E7C66; --accent-ink:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0F1513; --surface:#182120; --surface2:#1F2A28; --line:#2F3D39;
    --ink:#E4ECE8; --muted:#8FA39B; --accent:#3FBF9E; --accent-ink:#0B1512;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;background:var(--ground);color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:13px;line-height:1.5;
}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);
}
.brand{
  font-family:"IBM Plex Sans Condensed","Noto Sans TC",sans-serif;font-weight:700;
  font-size:14px;letter-spacing:.02em;white-space:nowrap;
}
.brand span{color:var(--muted);font-weight:500;margin-left:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:2px;padding:2px;background:var(--surface2);border-radius:6px}
nav button{
  font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;
  border:0;background:transparent;color:var(--muted);border-radius:4px;padding:5px 14px;
}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1 1 auto}
a.pop{color:var(--muted);text-decoration:none;font-size:12px;white-space:nowrap}
a.pop:hover{color:var(--accent);text-decoration:underline}
iframe{flex:1 1 auto;width:100%;border:0;background:var(--ground)}
</style>
</head>
<body>

<header>
  <div class="brand">泡酸 BENCH<span>MDP Line Slot</span></div>
  <nav id="tabs" role="tablist"></nav>
  <div class="spacer"></div>
  <a class="pop" id="pop" href="bench.html" target="_blank" rel="noopener">在新分頁開啟 ↗</a>
</header>

<iframe id="view" title="檢視區"></iframe>

<script>
const VIEWS = [
  {id:'bench',    label:'兵推台',   src:'bench.html',     title:'泡酸 BENCH 兵推台'},
  {id:'frame222', label:'配置圖',   src:'frame222.html',  title:'Bench 配置圖'},
];

const tabs = document.getElementById('tabs');
const view = document.getElementById('view');
const pop  = document.getElementById('pop');

VIEWS.forEach(v => {
  const b = document.createElement('button');
  b.type = 'button';
  b.role = 'tab';
  b.textContent = v.label;
  b.dataset.id = v.id;
  b.addEventListener('click', () => { location.hash = v.id; });
  tabs.appendChild(b);
});

function show(){
  const id = location.hash.slice(1);
  const v = VIEWS.find(x => x.id === id) || VIEWS[0];
  if (view.getAttribute('src') !== v.src) view.src = v.src;
  pop.href = v.src;
  document.title = v.title + ' — MDP Line Slot';
  tabs.querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-current', String(b.dataset.id === v.id));
  });
}

addEventListener('hashchange', show);
show();
</script>

</body>
</html>
